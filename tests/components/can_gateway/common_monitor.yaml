# Single-bus node (v0.6, S8/B19): one port, no routes — reads the bus with
# signal decode and writes it with can_gateway.send. No bridge, no enable switch.
esphome:
  on_boot:
    then:
      # Port may be omitted with a single declared port (V22); string payload.
      - can_gateway.send:
          can_id: 0x100
          data: [0x01, 0x02]
      - can_gateway.send:
          can_id: 0x7DF
          data: "hi"

can_gateway:
  id: mon
  ports:
    - id: car
      rx_pin: GPIO3
      tx_pin: GPIO2
      bit_rate: 500kbps
      observe_queue_depth: 48
  statistics:
    log_interval: 30s

sensor:
  - platform: can_gateway
    port_id: car
    can_id: 0x2A0
    offset: 2
    length: 2
    byte_order: big
    name: "Engine RPM"
    filters: [{multiply: 0.25}]
  - platform: can_gateway
    port_id: car
    can_id: 0x1B0
    bit_offset: 8
    bit_length: 12
    name: "Throttle"
  # Diagnostic sensors are valid on the single bus (V24 bus_load, observe).
  - platform: can_gateway
    port_id: car
    bus_load:
      name: "Car bus load"
    observed:
      name: "Car observed"
    observe_overflow:
      name: "Car observe overflow"

binary_sensor:
  - platform: can_gateway
    port_id: car
    can_id: 0x3C0
    bit: 5
    name: "Brake pressed"

text_sensor:
  - platform: can_gateway
    port_id: car
    can_id: 0x1A0
    offset: 0
    length: 1
    map:
      0: "Park"
      1: "Drive"
    name: "Gear position"
