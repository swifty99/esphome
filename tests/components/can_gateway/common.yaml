esphome:
  on_boot:
    then:
      # can_gateway.send (v0.6): static data -> flash-resident array, no RAM copy.
      - can_gateway.send:
          port: port_a
          can_id: 0x100
          data: [0x01, 0x02, 0x03]
      # Templated data + templated can_id -> generated function pointer paths.
      - can_gateway.send:
          port: port_a
          can_id: !lambda "return 0x18DAF110;"
          use_extended_id: true
          data: !lambda 'return {(uint8_t) (millis() & 0xFF), 0x02};'
      # String payload shorthand, like canbus.send.
      - can_gateway.send:
          port: port_a
          can_id: 0x101
          data: "abc"
      # can_gateway.inject remains a working alias for one release cycle.
      - can_gateway.inject:
          port: port_b
          can_id: 0x102
          data: [0x09]
      # Staged runtime patch update (S7): value + declared ID replacement.
      - can_gateway.set_patch:
          id: charge_limit
          can_id: 0x581
          data:
            - index: 2
              value: !lambda "return (uint8_t) 0x42;"
      # Cyclic (timed) send: update the staged payload, then start/stop.
      - can_gateway.set_cyclic_data:
          id: heartbeat
          data: !lambda "return {(uint8_t) (millis() & 0xFF), 0x00};"
      - can_gateway.start_cyclic: heartbeat
      - can_gateway.stop_cyclic: keepalive

can_gateway:
  id: gw
  interrupt_priority: 2
  ports:
    # Reference board wiring: TWAI0 TX GPIO2 / RX GPIO3,
    # TWAI1 TX GPIO10 / RX GPIO11.
    - id: port_a
      rx_pin: GPIO3
      tx_pin: GPIO2
      bit_rate: 125kbps
      tx_queue_depth: 8
      # v0.6 observation: this port both forwards (route_ab) and decodes
      # signals off the same bus (S11).
      observe_queue_depth: 48
      max_frames_per_loop: 24
      on_bus_off:
        then:
          - lambda: 'ESP_LOGW("test", "port A bus-off");'
      on_recovered:
        then:
          - lambda: 'ESP_LOGI("test", "port A recovered");'
    - id: port_b
      rx_pin: GPIO11
      tx_pin: GPIO10
      bit_rate: 125kbps
  # Bench-safe pattern (both controllers may share one wire): default drop,
  # disjoint input/output ID sets, so nothing can storm.
  routes:
    - id: route_ab
      from: port_a
      to: port_b
      default_action: drop
      filters:
        - can_id: 0x100
          modify:
            can_id: 0x200
        - id: charge_limit
          can_id: 0x355
          modify:
            can_id: 0x581
            data:
              - index: 2
                value: 0x64
        - can_id: 0x700
          can_id_mask: 0x780
          action: drop
        - can_id: 0x18DAF110
          use_extended_id: true
          modify:
            data:
              - index: 0
                value: 0x00
                mask: 0x80
    - id: route_ba
      from: port_b
      to: port_a
      default_action: drop
      filters:
        - can_id: 0x3E8
  # Timed (cyclic) sends: staged payload, transmitted every interval (Tier 1).
  cyclic_sends:
    - id: heartbeat
      port: port_a
      can_id: 0x700
      interval: 100ms
      data: [0x01, 0x00]
    - id: keepalive
      port: port_b
      can_id: 0x18FF0102
      use_extended_id: true
      interval: 500ms
      enabled: false
  # Bus statistics for the log (usage %, errors, per-ID timings).
  statistics:
    log_interval: 30s
    id_timings: true
    id_timings_max: 16

sensor:
  - platform: can_gateway
    route_id: route_ab
    update_interval: 30s
    forwarded:
      name: "AB forwarded"
    filtered:
      name: "AB filtered"
    tx_full:
      name: "AB shed overload"
    bus_off:
      name: "AB shed bus dead"
    disabled:
      name: "AB shed gateway off"
  - platform: can_gateway
    port_id: port_a
    injected:
      name: "A injected"
    tx_fail:
      name: "A TX failures"
    bus_err:
      name: "A bus errors"
    recoveries:
      name: "A recoveries"
    tec:
      name: "A TX error counter"
    rec:
      name: "A RX error counter"
    bus_load:
      name: "A bus load"
    observed:
      name: "A observed"
    observe_overflow:
      name: "A observe overflow"
  # v0.6 signal decode (S9): numeric signals named by position in a message.
  - platform: can_gateway
    port_id: port_a
    can_id: 0x2A0
    offset: 2
    length: 2
    byte_order: big
    name: "Engine RPM"
    filters: [{multiply: 0.25}]
  - platform: can_gateway
    port_id: port_a
    can_id: 0x2A0
    bit_offset: 24
    bit_length: 4
    name: "Selected gear"
    throttle: 200ms
  - platform: can_gateway
    port_id: port_a
    can_id: 0x1B0
    offset: 0
    length: 1
    signed: true
    name: "Coolant temp"
    filters: [{offset: -40}]

binary_sensor:
  - platform: can_gateway
    port_id: port_a
    bus_off:
      name: "Bus A bus-off"
  # v0.6 single-bit decode.
  - platform: can_gateway
    port_id: port_a
    can_id: 0x3C0
    bit: 5
    name: "Brake pressed"

text_sensor:
  - platform: can_gateway
    port_id: port_a
    throttle: 1s
    last_frame:
      name: "Port A last frame"
  # v0.6 enum decode (raw integer -> string).
  - platform: can_gateway
    port_id: port_a
    can_id: 0x1A0
    offset: 0
    length: 1
    map:
      0: "Park"
      1: "Reverse"
      2: "Neutral"
      3: "Drive"
    name: "Gear position"

switch:
  - platform: can_gateway
    name: "Gateway enable"
